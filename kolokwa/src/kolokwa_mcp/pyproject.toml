[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kolokwa-mcp"
version = "0.1.0"
description = "MCP servers for Kolokwa dictionary and translation"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.2.0",
    "mcp>=0.9.0",
    "asyncpg>=0.29.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
kolokwa-dictionary = "kolokwa_mcp.dictionary_server:main"
kolokwa-translator = "kolokwa_mcp.translation_server:main"