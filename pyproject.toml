[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kolokwa-mcp"
version = "0.1.0"
description = "MCP servers for Kolokwa dictionary and translation"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.12.3",
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
# Find packages in kolokwa/src directory
packages = ["kolokwa_mcp"]
package-dir = {"kolokwa_mcp" = "kolokwa/src/kolokwa_mcp"}