[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kolokwa-mcp"
version = "0.1.0"
description = "MCP servers for Kolokwa dictionary and translation"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.12.3",
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
# Only include the kolokwa_mcp package from the kolokwa/src directory
packages = ["kolokwa_mcp"]

[tool.setuptools.package-dir]
# Map kolokwa_mcp package to its actual location
kolokwa_mcp = "kolokwa/src/kolokwa_mcp"

[tool.setuptools.packages.find]
# Find packages only in kolokwa/src
where = ["kolokwa/src"]
include = ["kolokwa_mcp*"]
# Explicitly exclude Django apps and other directories
exclude = [
    "users*",
    "dictionary*", 
    "nl_interact*",
    "gamification*",
    "templates*",
    "database_backups*",
    "Kolokwa_connect*"
]