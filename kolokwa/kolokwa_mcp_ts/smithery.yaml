server:
  # The command to start your MCP server
  command: node
  args:
    - build/index.js
  
  # Environment variables needed by your server
  env:
    DATABASE_HOST: ${DATABASE_HOST}
    DATABASE_PORT: ${DATABASE_PORT}
    DATABASE_USER: ${DATABASE_USER}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    DATABASE_NAME: ${DATABASE_NAME}

# Metadata for Smithery listing
metadata:
  title: Kolokwa Dictionary MCP
  description: |
    Access the Liberian Kolokwa Dictionary directly from Claude. Search for words, 
    translate phrases, and get cultural context.
    
    Features:
    - Search verified Kolokwa-English dictionary entries
    - Get detailed entry information with examples
    - Browse verified entries
    - Pronunciation guides and cultural notes
    
    Perfect for learning authentic Liberian Kolokwa.
  
  tags:
    - dictionary
    - translation
    - language
    - kolokwa
    - liberia
  
  homepage: https://github.com/E-ditital1000/Kolokwa_connect
  license: MIT
  
  author:
    name: Kolokwa Connect
    url: https://github.com/E-ditital1000

# Required dependencies
requirements:
  node: ">=18.0.0"